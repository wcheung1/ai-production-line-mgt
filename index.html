        saveProjectModal() {
          const id = document.getElementById('pmProjectId').value;
          const targetToolVal = document.getElementById('pmToolId').value;
          const name = document.getElementById('pmName').value.trim();
          const dirsRaw = document.getElementById('pmDirs').value;
          const progress = document.getElementById('pmProgress').value.trim();
          const cookMode = document.getElementById('pmCookMode').value;
          const estMins = Math.max(1, Number(document.getElementById('pmEstMinutes').value) || 30);

          if (!name) {
            showToast('⚠️ 請填寫 Project 名稱！');
            return;
          }

          const directories = dirsRaw
            .split(/\r?\n/)
            .map(s => s.trim())
            .filter(Boolean);

          const isQueue = targetToolVal === 'QUEUE';
          const now = nowTs();

          // 若揀咗某個正在煮緊嘢嘅爐頭，先檢查會唔會撞鑊
          if (!isQueue) {
            const conflict = state.db.projects.find(p => p.toolId === targetToolVal && p.id !== id && (p.status === 'running' || p.status === 'review' || p.status === 'paused'));
            if (conflict) {
              const ok = confirm(`「${conflict.name}」目前仲霸緊呢個爐頭！\n你想將舊嗰個退返去「備料待煮區」，定係取消？\n（撳「確定」會將舊 Project 移去備料區並換新餸落鍋）`);
              if (!ok) return;
              const elapsed = conflict.status === 'running' ? (now - (conflict.currentRunStartedAt || conflict.startedAt)) / 60000 : 0;
              conflict.accumulatedMinutes = Math.round((conflict.accumulatedMinutes || 0) + elapsed);
              conflict.status = 'queued';
              conflict.preferredToolId = targetToolVal;
              conflict.toolId = null;
            }
          }

          const toolObj = isQueue ? null : state.db.tools.find(t => t.id === targetToolVal);
          if (toolObj) toolObj.cooldownUntil = null;

          if (id) {
            const p = state.db.projects.find(x => x.id === id);
            if (p) {
              const wasQueued = p.status === 'queued' || !p.toolId;
              p.name = name;
              p.directories = directories;
              p.progressNote = progress;
              p.cookMode = cookMode;
              p.estimatedMinutes = estMins;
              p.isSample = false;

              if (isQueue) {
                p.status = 'queued';
                p.toolId = null;
              } else {
                p.toolId = targetToolVal;
                if (wasQueued || p.status === 'completed') {
                  p.status = 'running';
                  p.currentRunStartedAt = now;
                  if (!p.startedAt) p.startedAt = now;
                  addLog('start', toolObj, p, 0, '從備料區落鍋開火');
                }
              }
            }
          } else {
            const newProj = {
              id: 'proj_' + now + '_' + Math.random().toString(36).slice(2, 6),
              name,
              toolId: isQueue ? null : targetToolVal,
              preferredToolId: isQueue ? null : targetToolVal,
              status: isQueue ? 'queued' : 'running',
              directories,
              progressNote: progress,
              cookMode,
              estimatedMinutes: estMins,
              startedAt: now,
              currentRunStartedAt: isQueue ? null : now,
              accumulatedMinutes: 0,
              completedAt: null,
              qaChecklist: { refined: false, verified: false, deployed: false },
              feedbackCount: 0,
              feedbackLogs: [],
              isSample: false
            };
            state.db.projects.push(newProj);
            addLog(isQueue ? 'queue' : 'start', toolObj, newProj, 0, isQueue ? '加入備料區' : '新落鍋開火');
          }

          this.closeModal('projectModal');
          persistState();
          renderAll();
          showToast(isQueue ? '🧺 已放入備料待煮區！' : `🔥 已落鍋開火：${name}`);
        },
        assignQueuedToStove(projId, toolId) {
          const p = state.db.projects.find(x => x.id === projId);
          const tool = state.db.tools.find(t => t.id === toolId);
          if (!p || !tool) return;
          const now = nowTs();
          p.toolId = toolId;
          p.status = 'running';
          p.startedAt = p.startedAt || now;
          p.currentRunStartedAt = now;
          p.isSample = false;
          tool.cooldownUntil = null;
          addLog('start', tool, p, 0, '從備料區直接落鍋');
          persistState();
          renderAll();
          showToast(`🔥 已將「${p.name}」擺落 ${tool.name} 開火！`);
        },
        quickSaveProgress(projId) {
          const p = state.db.projects.find(x => x.id === projId);
          const input = document.getElementById('prog_in_' + projId);
          if (!p || !input) return;
          p.progressNote = input.value.trim();
          p.isSample = false;
          const tool = state.db.tools.find(t => t.id === p.toolId);
          addLog('progress_update', tool, p, 0, p.progressNote);
          persistState();
          showToast('💬 已更新進度並儲存到 Database！');
        },
        toggleQaCheck(projId, key, checked) {
          const p = state.db.projects.find(x => x.id === projId);
          if (!p) return;
          if (!p.qaChecklist) p.qaChecklist = { refined: false, verified: false, deployed: false };
          p.qaChecklist[key] = !!checked;
          p.isSample = false;
          persistState();
          renderAll();
        },
        moveToReview(projId) {
          const p = state.db.projects.find(x => x.id === projId);
          if (!p) return;
          const now = nowTs();
          if (p.status === 'running') {
            const elapsed = (now - (p.currentRunStartedAt || p.startedAt)) / 60000;
            p.accumulatedMinutes = Math.max(1, Math.round((p.accumulatedMinutes || 0) + elapsed));
          }
          p.status = 'review';
          p.isSample = false;
          const tool = state.db.tools.find(t => t.id === p.toolId);
          addLog('ready_for_qa', tool, p, p.accumulatedMinutes, '進入修整、驗證及 Deploy 階段');
          persistState();
          renderAll();
          showToast('👨‍🍳 已轉為「待修整・驗證・Deploy」！試下 Work 唔 Work');
        },
        openFeedbackModal(projId) {
          const p = state.db.projects.find(x => x.id === projId);
          if (!p) return;
          document.getElementById('fmProjectId').value = p.id;
          document.getElementById('fmNote').value = '';
          document.getElementById('fmProgress').value = p.progressNote || '';
          document.getElementById('fmMinutes').value = Math.min(45, p.estimatedMinutes || 25);
          document.getElementById('feedbackModal').classList.add('open');
        },
        submitFeedbackRework() {
          const projId = document.getElementById('fmProjectId').value;
          const note = document.getElementById('fmNote').value.trim() || '測試未如理想，畀 Feedback 回鍋執靚啲';
          const progress = document.getElementById('fmProgress').value.trim();
          const mins = Math.max(1, Number(document.getElementById('fmMinutes').value) || 25);

          const p = state.db.projects.find(x => x.id === projId);
          if (!p) return;
          const now = nowTs();
          if (p.status === 'running') {
            const elapsed = (now - (p.currentRunStartedAt || p.startedAt)) / 60000;
            p.accumulatedMinutes = Math.round((p.accumulatedMinutes || 0) + elapsed);
          }
          p.feedbackCount = (p.feedbackCount || 0) + 1;
          if (!Array.isArray(p.feedbackLogs)) p.feedbackLogs = [];
          p.feedbackLogs.push({ at: now, note });
          if (progress) p.progressNote = progress;
          p.estimatedMinutes = mins;
          p.status = 'running';
          p.currentRunStartedAt = now;
          p.qaChecklist = { refined: false, verified: false, deployed: false };
          p.isSample = false;

          const tool = state.db.tools.find(t => t.id === p.toolId);
          addLog('feedback_rework', tool, p, 0, note);
          this.closeModal('feedbackModal');
          persistState();
          renderAll();
          showToast(`🔄 已記錄第 ${p.feedbackCount} 次回鍋 Feedback，爐頭重新計時開火！`);
        },
        completeProject(projId) {
          const p = state.db.projects.find(x => x.id === projId);
          if (!p) return;
          const qa = p.qaChecklist || {};
          if (!qa.verified || !qa.deployed) {
            const proceed = confirm('提醒：「本地驗證」或「Deploy 確認 Work」仲未剔齊喎！\n確定已經試過 Work 並完成上菜釋放爐頭嗎？');
            if (!proceed) return;
          }
          const now = nowTs();
          if (p.status === 'running') {
            const elapsed = (now - (p.currentRunStartedAt || p.startedAt)) / 60000;
            p.accumulatedMinutes = Math.max(1, Math.round((p.accumulatedMinutes || 0) + elapsed));
          } else if (!p.accumulatedMinutes) {
            p.accumulatedMinutes = Math.max(1, Math.round((now - (p.startedAt || now)) / 60000));
          }
          p.qaChecklist = { refined: true, verified: true, deployed: true };
          p.status = 'completed';
          p.completedAt = now;
          p.isSample = false;

          const tool = state.db.tools.find(t => t.id === p.toolId);
          if (tool) tool.lastActiveEndedAt = now;
          addLog('complete', tool, p, p.accumulatedMinutes, '驗證及 Deploy 成功，完成上菜');

          persistState();
          renderAll();
          showToast(`✅ 恭喜！「${p.name}」已完成上菜，${tool ? tool.name : '爐頭'} 已釋放可接新任務！`);
        },
        reopenProject(projId) {
          const p = state.db.projects.find(x => x.id === projId);
          if (!p) return;
          p.status = 'queued';
          p.completedAt = null;
          persistState();
          this.openEditProjectModal(projId);
        },
        deleteProject(projId) {
          if (!confirm('確定要刪除呢個 Project 紀錄嗎？')) return;
          state.db.projects = state.db.projects.filter(p => p.id !== projId);
          persistState();
          renderAll();
          showToast('🗑️ 已刪除 Project');
        },
        clearSampleProjects() {
          state.db.projects = state.db.projects.filter(p => !p.isSample);
          state.db.logs = state.db.logs.filter(l => !String(l.id).startsWith('log_sample_'));
          persistState();
          renderAll();
          showToast('🧹 已清空所有範例項目，可以正式擺你嘅真實 Project 落鍋！');
        },
        promptUpdateQuota(toolId) {
          const t = state.db.tools.find(x => x.id === toolId);
          if (!t) return;
          const val = prompt(`更新「${t.name}」目前已用算力 / Quota 百分比 (0 - 100)：\n（方便睇住仲有幾多 Entitled 額度可以用盡！）`, t.quotaUsedPct || 0);
          if (val === null) return;
          const num = Math.min(100, Math.max(0, Math.round(Number(val) || 0)));
          t.quotaUsedPct = num;
          persistState();
          renderAll();
          showToast(`📊 已更新 ${t.name} 已用配額為 ${num}%`);
        },
        setCooldown(toolId) {
          const t = state.db.tools.find(x => x.id === toolId);
          if (!t) return;
          const hrs = prompt(`「${t.name}」暫時用爆咗本輪額度？\n請輸入預計幾多個鐘頭之後重置（例如 3）：`, '3');
          if (hrs === null) return;
          const h = Math.max(0.2, Number(hrs) || 3);
          t.cooldownUntil = nowTs() + h * 3600 * 1000;
          t.quotaUsedPct = 100;
          persistState();
          renderAll();
          showToast(`❄️ 已標記 ${t.name} 冷卻 ${h} 小時`);
        },
        clearCooldown(toolId) {
          const t = state.db.tools.find(x => x.id === toolId);
          if (!t) return;
          t.cooldownUntil = null;
          if (t.quotaUsedPct === 100) t.quotaUsedPct = 0;
          t.lastActiveEndedAt = nowTs();
          persistState();
          renderAll();
          showToast(`🔥 ${t.name} 已恢復閒置可用狀態！`);
        },
        openNewToolModal() {
          document.getElementById('toolModalTitle').textContent = '🛠️ 新增 AI 訂閱工具（加新爐頭）';
          document.getElementById('tmId').value = '';
          document.getElementById('tmIcon').value = '🤖';
          document.getElementById('tmName').value = '';
          document.getElementById('tmWorkflow').value = '';
          document.getElementById('tmCost').value = 150;
          document.getElementById('tmQuota').value = 0;
          document.getElementById('tmResetNote').value = '每月 / 滾動視窗重置';
          document.getElementById('toolModal').classList.add('open');
        },
        openEditToolModal(toolId) {
          const t = state.db.tools.find(x => x.id === toolId);
          if (!t) return;
          document.getElementById('toolModalTitle').textContent = '✏️ 編輯 AI 訂閱工具';
          document.getElementById('tmId').value = t.id;
          document.getElementById('tmIcon').value = t.icon || '🤖';
          document.getElementById('tmName').value = t.name || '';
          document.getElementById('tmWorkflow').value = t.workflow || '';
          document.getElementById('tmCost').value = t.monthlyCostHKD || 0;
          document.getElementById('tmQuota').value = t.quotaUsedPct || 0;
          document.getElementById('tmResetNote').value = t.quotaResetLabel || '';
          document.getElementById('toolModal').classList.add('open');
        },
        saveToolModal() {
          const id = document.getElementById('tmId').value;
          const icon = document.getElementById('tmIcon').value.trim() || '🤖';
          const name = document.getElementById('tmName').value.trim();
          const workflow = document.getElementById('tmWorkflow').value.trim();
          const cost = Math.max(0, Number(document.getElementById('tmCost').value) || 0);
          const quota = Math.min(100, Math.max(0, Number(document.getElementById('tmQuota').value) || 0));
          const resetNote = document.getElementById('tmResetNote').value.trim();

          if (!name) {
            showToast('⚠️ 請輸入工具名稱');
            return;
          }

          if (id) {
            const t = state.db.tools.find(x => x.id === id);
            if (t) {
              t.icon = icon;
              t.name = name;
              t.workflow = workflow;
              t.monthlyCostHKD = cost;
              t.quotaUsedPct = quota;
              t.quotaResetLabel = resetNote;
            }
          } else {
            state.db.tools.push({
              id: 'tool_' + nowTs() + '_' + Math.random().toString(36).slice(2, 5),
              name,
              icon,
              workflow,
              monthlyCostHKD: cost,
              quotaUsedPct: quota,
              quotaResetLabel: resetNote,
              cooldownUntil: null,
              lastActiveEndedAt: nowTs(),
              archived: false,
              order: state.db.tools.length + 1
            });
          }

          this.closeModal('toolModal');
          persistState();
          renderAll();
          showToast(`✅ 已儲存工具：${name}`);
        },
        toggleArchiveTool(toolId) {
          const t = state.db.tools.find(x => x.id === toolId);
          if (!t) return;
          t.archived = !t.archived;
          persistState();
          renderAll();
          showToast(t.archived ? `📦 已封存 ${t.name}（歷史數據已保留供分析）` : `♻️ 已重新啟用 ${t.name}`);
        },
        deleteTool(toolId) {
          const t = state.db.tools.find(x => x.id === toolId);
          if (!t) return;
          if (!confirm(`確定要徹底刪除「${t.name}」嗎？\n（如果只想退訂但保留過往統計數據，建議用「退訂封存」功能）`)) return;
          state.db.tools = state.db.tools.filter(x => x.id !== toolId);
          state.db.projects.forEach(p => {
            if (p.toolId === toolId && p.status !== 'completed') {
              p.status = 'queued';
              p.toolId = null;
            }
          });
          persistState();
          renderAll();
          showToast(`🗑️ 已刪除工具：${t.name}`);
        },
        setProjSearch(val) {
          state.projSearch = val;
          refreshProjectsTableOnly();
        },
        setProjFilterStatus(val) {
          state.projFilterStatus = val;
          refreshProjectsTableOnly();
        },
        setProjFilterTool(val) {
          state.projFilterTool = val;
          refreshProjectsTableOnly();
        },
        setAnalyticsDays(val) {
          state.prefs.analyticsDays = Number(val);
          savePrefs();
          renderAnalyticsTab(document.getElementById('mainView'));
        },
        exportCSV() {
          const rows = [
            ['Project名稱', '使用AI工具', '狀態', '相關File_Directories', '一句講進度', '預計分鐘', '實際累計分鐘', '回鍋Feedback次數', '開始時間', '完成時間']
          ];
          state.db.projects.forEach(p => {
            const t = state.db.tools.find(x => x.id === (p.toolId || p.preferredToolId));
            rows.push([
              p.name || '',
              t ? t.name : '未指定',
              p.status || '',
              (p.directories || []).join(' ; '),
              p.progressNote || '',
              p.estimatedMinutes || 0,
              p.accumulatedMinutes || 0,
              p.feedbackCount || 0,
              formatDateTime(p.startedAt),
              formatDateTime(p.completedAt)
            ]);
          });
          const csvContent = '\uFEFF' + rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\r\n');
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `AI生產線報表_${new Date().toISOString().slice(0,10)}.csv`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('📊 已匯出 CSV 報表（可直接用 Excel 打開）');
        },
        exportJSONBackup() {
          const blob = new Blob([JSON.stringify(state.db, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `AI生產線完整備份_${new Date().toISOString().slice(0,10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('💾 已下載完整 JSON 資料庫備份');
        },
        importJSONBackup(event) {
          const file = event.target.files && event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const parsed = JSON.parse(e.target.result);
              if (!parsed || !Array.isArray(parsed.tools) || !Array.isArray(parsed.projects)) {
                showToast('⚠️ 備份檔案格式唔正確');
                return;
              }
              state.db = {
                tools: parsed.tools,
                projects: parsed.projects,
                logs: parsed.logs || []
              };
              persistState();
              renderAll();
              showToast('✅ 成功匯入資料庫備份並已同步！');
            } catch (err) {
              showToast('⚠️ 讀取 JSON 失敗');
            }
          };
          reader.readAsText(file);
        },
        saveCloudSetup() {
          const email = document.getElementById('cfgOwnerEmail').value.trim();
          const raw = document.getElementById('cfgFirebaseRaw').value;
          const parsedCfg = parseFirebaseConfigInput(raw);
          if (!parsedCfg) {
            showToast('⚠️ 無法識別 firebaseConfig！請確認成段貼入包含 apiKey 同 projectId 嘅內容');
            return false;
          }
          state.cloudCfg = { firebaseConfig: parsedCfg, ownerEmail: email };
          localStorage.setItem(STORAGE_KEY_CLOUD, JSON.stringify(state.cloudCfg));
          state.bypassAuthLock = false;
          showToast('✅ 已儲存雲端設定！');
          renderAll();
          initFirebaseIfConfigured();
          return true;
        },
        exportConfiguredHtml() {
          const emailEl = document.getElementById('cfgOwnerEmail');
          const rawEl = document.getElementById('cfgFirebaseRaw');
          if (emailEl && rawEl && rawEl.value.trim()) {
            const parsed = parseFirebaseConfigInput(rawEl.value);
            if (!parsed) {
              showToast('⚠️ 請先貼上正確嘅 firebaseConfig 先再匯出檔案！');
              return;
            }
            state.cloudCfg = { firebaseConfig: parsed, ownerEmail: emailEl.value.trim() };
            localStorage.setItem(STORAGE_KEY_CLOUD, JSON.stringify(state.cloudCfg));
          }

          if (!state.cloudCfg || !state.cloudCfg.firebaseConfig) {
            showToast('⚠️ 請先喺第 2 步貼上 Firebase 設定！');
            return;
          }

          const safeJson = JSON.stringify(state.cloudCfg)
            .replace(/</g, '\\u003c')
            .replace(/>/g, '\\u003e');
          const exportRoot = CLEAN_ROOT_CLONE.cloneNode(true);
          const cfgSlot = exportRoot.querySelector('#embedded-cloud-config');
          if (cfgSlot) {
            cfgSlot.textContent = safeJson;
          }
          const mainEl = exportRoot.querySelector('#mainView');
          if (mainEl) mainEl.innerHTML = '';
          const statsEl = exportRoot.querySelector('#headerStats');
          if (statsEl) statsEl.innerHTML = '';
          const toastEl = exportRoot.querySelector('#toastContainer');
          if (toastEl) toastEl.innerHTML = '';
          const gateEl = exportRoot.querySelector('#authGate');
          if (gateEl) gateEl.classList.remove('active');
          const updatedHtml = '<!DOCTYPE html>\n' + exportRoot.outerHTML;

          const blob = new Blob([updatedHtml], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'index.html';
          a.click();
          URL.revokeObjectURL(url);
          showToast('📦 已下載 index.html！直接 Upload 上你嘅 GitHub Repository 就用得！');
        },
        updateRulesPreview(val) {
          const email = (val || '').trim() || '請先在上方填寫你的Gmail@gmail.com';
          const block = document.getElementById('rulesBlock');
          if (block) {
            block.textContent = `rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /users/{userId}/{document=**} {\n      allow read, write: if request.auth != null && request.auth.token.email == "${email}";\n    }\n  }\n}`;
          }
        },
        copyFirestoreRules() {
          const emailEl = document.getElementById('cfgOwnerEmail');
          const email = (emailEl ? emailEl.value.trim() : state.cloudCfg.ownerEmail) || '請填入你的Email@gmail.com';
          const rules = `rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /users/{userId}/{document=**} {\n      allow read, write: if request.auth != null && request.auth.token.email == "${email}";\n    }\n  }\n}`;
          this.copyText(rules);
        },
        clearCloudSetup() {
          if (!confirm('確定要清除瀏覽器儲存嘅雲端連線設定並切換回純本地模式嗎？')) return;
          localStorage.removeItem(STORAGE_KEY_CLOUD);
          state.cloudCfg = { firebaseConfig: null, ownerEmail: '' };
          state.cloudConnected = false;
          state.currentUser = null;
          document.getElementById('authGate').classList.remove('active');
          renderAll();
          showToast('💻 已切換回本地模式');
        },
        bypassToSetup() {
          state.bypassAuthLock = true;
          document.getElementById('authGate').classList.remove('active');
          state.activeTab = 'cloud';
          renderAll();
        },
        async signInWithGoogle() {
          if (!state.auth || !state.fbModules) {
            await initFirebaseIfConfigured();
          }
          if (!state.auth || !state.fbModules) {
            showToast('⚠️ 請先完成雲端設定，並確認透過 GitHub Pages 網址開啟');
            return;
          }
          const errBox = document.getElementById('authErrorMsg');
          errBox.style.display = 'none';
          try {
            await state.fbModules.signInWithPopup(state.auth, state.googleProvider);
          } catch (err) {
            console.error(err);
            errBox.style.display = 'block';
            if (err.code === 'auth/unauthorized-domain') {
              errBox.innerHTML = `⚠️ <strong>網域未授權：</strong>請去 Firebase Console → Authentication → Settings → Authorized domains 加入 <code>${escapeHtml(window.location.hostname)}</code>`;
            } else if (err.code === 'auth/popup-blocked') {
              await state.fbModules.signInWithRedirect(state.auth, state.googleProvider);
            } else {
              errBox.textContent = '登入失敗：' + (err.message || err.code);
            }
          }
        },
        async signOutGoogle() {
          if (state.auth && state.fbModules) {
            await state.fbModules.signOut(state.auth);
            showToast('👋 已登出 Google 帳號');
          }
        }
      };

      // 啟動渲染及檢查雲端狀態
      renderAll();
      initFirebaseIfConfigured();
    })();
  </script></body></html>
