  <style>
    :root {
      --bg-base: #0b1120;
      --bg-surface: #131c31;
      --bg-elevated: #1c2842;
      --bg-input: #0f172a;
      --border-subtle: rgba(148, 163, 184, 0.16);
      --border-strong: rgba(148, 163, 184, 0.3);
      --text-main: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-primary: #f97316;
      --accent-primary-hover: #ea580c;
      --status-idle: #10b981;
      --status-idle-bg: rgba(16, 185, 129, 0.12);
      --status-run: #f97316;
      --status-run-bg: rgba(249, 115, 22, 0.13);
      --status-qa: #eab308;
      --status-qa-bg: rgba(234, 179, 8, 0.14);
      --status-cool: #38bdf8;
      --status-cool-bg: rgba(56, 189, 248, 0.12);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.14);
      --purple: #a855f7;
      --shadow-card: 0 10px 28px -6px rgba(0, 0, 0, 0.45);
      --radius-lg: 16px;
      --radius-md: 11px;
      --radius-sm: 8px;
    }

    [data-theme="light"] {
      --bg-base: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-elevated: #f8fafc;
      --bg-input: #f8fafc;
      --border-subtle: rgba(15, 23, 42, 0.1);
      --border-strong: rgba(15, 23, 42, 0.2);
      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --shadow-card: 0 8px 24px -6px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans HK', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.55;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    code, .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      transition: all 0.18s ease;
    }

    /* Top Navigation & Header */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(19, 28, 49, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 24px;
    }
    [data-theme="light"] .top-header {
      background: rgba(255, 255, 255, 0.9);
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f97316, #eab308);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.35);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
    }
    .stat-pill.run { border-color: rgba(249,115,22,0.4); color: #fb923c; background: var(--status-run-bg); }
    .stat-pill.qa { border-color: rgba(234,179,8,0.5); color: #facc15; background: var(--status-qa-bg); }
    .stat-pill.idle { border-color: rgba(16,185,129,0.45); color: #34d399; background: var(--status-idle-bg); }
    [data-theme="light"] .stat-pill.run { color: #c2410c; }
    [data-theme="light"] .stat-pill.qa { color: #a16207; }
    [data-theme="light"] .stat-pill.idle { color: #047857; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .icon-btn {
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .icon-btn:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .sync-badge {
      padding: 7px 13px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
    }
    .sync-badge.cloud {
      background: rgba(16, 185, 129, 0.14);
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
    }
    [data-theme="light"] .sync-badge.cloud { color: #047857; }
    .sync-badge.local {
      background: rgba(56, 189, 248, 0.13);
      border-color: rgba(56, 189, 248, 0.35);
      color: #38bdf8;
    }
    [data-theme="light"] .sync-badge.local { color: #0369a1; }

    /* Navigation Tabs */
    .nav-bar {
      max-width: 1440px;
      margin: 16px auto 0;
      padding: 0 24px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-bar::-webkit-scrollbar { display: none; }

    .nav-tab {
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .nav-tab:hover {
      color: var(--text-main);
      border-color: var(--border-strong);
    }
    .nav-tab.active {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.3);
    }

    .badge-count {
      padding: 1px 7px;
      border-radius: 99px;
      font-size: 11.5px;
      background: rgba(255, 255, 255, 0.22);
      color: inherit;
    }

    /* Main Container */
    .main-container {
      max-width: 1440px;
      margin: 20px auto 0;
      padding: 0 24px;
    }

    /* Banners */
    .chef-banner {
      background: linear-gradient(90deg, rgba(249, 115, 22, 0.14), rgba(234, 179, 8, 0.08));
      border: 1px solid rgba(249, 115, 22, 0.32);
      border-radius: var(--radius-lg);
      padding: 14px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .chef-banner-text {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }

    .sample-banner {
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
    }

    /* Buttons */
    .btn {
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent-primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-primary-hover); transform: translateY(-1px); }

    .btn-idle {
      background: #10b981;
      color: #fff;
    }
    .btn-idle:hover { background: #059669; transform: translateY(-1px); }

    .btn-qa {
      background: #eab308;
      color: #0f172a;
    }
    .btn-qa:hover { background: #ca8a04; color: #fff; }

    .btn-secondary {
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      color: var(--text-main);
    }
    .btn-secondary:hover { background: var(--border-subtle); }

    .btn-danger {
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
    }
    [data-theme="light"] .btn-danger { color: #dc2626; }
    .btn-danger:hover { background: #ef4444; color: #fff; }

    .btn-sm {
      padding: 6px 11px;
      font-size: 12.5px;
    }

    /* Stove Grid (10 Woks Metaphor) */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stoves-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
      gap: 18px;
      margin-bottom: 32px;
    }

    @media (max-width: 480px) {
      .stoves-grid { grid-template-columns: 1fr; }
      .main-container, .nav-bar, .top-header { padding-left: 14px; padding-right: 14px; }
    }

    .stove-card {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 2px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.18s ease, border-color 0.2s ease;
      position: relative;
    }

    .stove-card.state-idle { border-color: rgba(16, 185, 129, 0.45); }
    .stove-card.state-running { border-color: rgba(249, 115, 22, 0.55); }
    .stove-card.state-overdue {
      border-color: #eab308;
      box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.2), var(--shadow-card);
    }
    .stove-card.state-review {
      border-color: #a855f7;
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.18), var(--shadow-card);
    }
    .stove-card.state-cooldown { border-color: rgba(56, 189, 248, 0.4); opacity: 0.92; }

    .stove-top {
      padding: 15px 18px 12px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .tool-identity {
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }

    .tool-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .tool-name {
      font-size: 15.5px;
      font-weight: 700;
      line-height: 1.25;
    }

    .tool-workflow {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .status-chip {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .chip-idle { background: var(--status-idle-bg); color: #34d399; border: 1px solid rgba(16,185,129,0.35); }
    .chip-running { background: var(--status-run-bg); color: #fb923c; border: 1px solid rgba(249,115,22,0.4); }
    .chip-overdue { background: var(--status-qa-bg); color: #facc15; border: 1px solid #eab308; animation: pulseGlow 1.6s infinite; }
    .chip-review { background: rgba(168, 85, 247, 0.16); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.45); }
    .chip-cool { background: var(--status-cool-bg); color: #38bdf8; border: 1px solid rgba(56,189,248,0.35); }

    [data-theme="light"] .chip-idle { color: #047857; }
    [data-theme="light"] .chip-running { color: #c2410c; }
    [data-theme="light"] .chip-overdue { color: #854d0e; }
    [data-theme="light"] .chip-review { color: #7e22ce; }
    [data-theme="light"] .chip-cool { color: #0369a1; }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* Quota Bar inside Stove */
    .quota-strip {
      padding: 8px 18px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
    }

    .quota-bar-wrap {
      flex: 1;
      height: 7px;
      background: var(--bg-input);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      cursor: pointer;
    }

    .quota-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .stove-body {
      padding: 16px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    /* Active Dish Info */
    .project-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .project-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      word-break: break-word;
    }

    .cook-badge {
      font-size: 11.5px;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    /* Timer Progress Box */
    .timer-box {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 12px;
    }

    .timer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      margin-bottom: 6px;
    }

    .timer-progress-track {
      height: 6px;
      background: var(--bg-elevated);
      border-radius: 99px;
      overflow: hidden;
    }

    .timer-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f97316, #eab308);
      border-radius: 99px;
      transition: width 0.5s linear;
    }
    .timer-progress-fill.overdue {
      background: linear-gradient(90deg, #eab308, #ef4444);
    }

    /* Inline 1-Sentence Progress */
    .progress-inline-box {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field-mini-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .inline-progress-row {
      display: flex;
      gap: 6px;
    }

    .inline-input {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      font-size: 13px;
      color: var(--text-main);
    }
    .inline-input:focus {
      outline: none;
      border-color: var(--accent-primary);
    }

    /* Directories Pills */
    .dir-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .dir-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 5px 9px;
      font-size: 12px;
    }

    .dir-path {
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #93c5fd;
    }
    [data-theme="light"] .dir-path { color: #1d4ed8; }

    .copy-mini-btn {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .copy-mini-btn:hover {
      color: var(--text-main);
      border-color: var(--border-strong);
    }

    /* QA 3-Step Checklist */
    .qa-box {
      background: rgba(168, 85, 247, 0.07);
      border: 1px dashed rgba(168, 85, 247, 0.35);
      border-radius: var(--radius-md);
      padding: 10px 12px;
    }

    .qa-title {
      font-size: 12px;
      font-weight: 700;
      color: #c084fc;
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    [data-theme="light"] .qa-title { color: #7e22ce; }

    .qa-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .qa-check-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      cursor: pointer;
      user-select: none;
    }

    .qa-check-item input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #10b981;
      cursor: pointer;
    }

    /* Idle Empty Wok Box */
    .idle-empty-box {
      flex: 1;
      border: 1.5px dashed rgba(16, 185, 129, 0.35);
      background: rgba(16, 185, 129, 0.05);
      border-radius: var(--radius-md);
      padding: 22px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .idle-wok-icon {
      font-size: 30px;
    }

    .idle-time-note {
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .stove-footer {
      padding: 12px 18px;
      background: var(--bg-elevated);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    /* Prep Queue Section */
    .prep-section {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-top: 10px;
    }

    .prep-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .prep-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Tables & Filters */
    .panel-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }

    .form-input, .form-select, .form-textarea {
      background: var(--bg-input);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      font-size: 13.5px;
      color: var(--text-main);
      width: 100%;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--accent-primary);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    th, td {
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: top;
    }

    th {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-secondary);
      background: var(--bg-elevated);
      font-weight: 700;
    }

    tr:hover td {
      background: rgba(148, 163, 184, 0.04);
    }

    /* KPI Analytics Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-card);
    }

    .kpi-label {
      font-size: 12.5px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 700;
      margin: 6px 0 4px;
    }

    .kpi-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Bar Chart Rows */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .bar-label {
      width: 170px;
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .bar-track {
      flex: 1;
      height: 14px;
      background: var(--bg-input);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #f97316, #10b981);
    }
    .bar-val {
      width: 90px;
      text-align: right;
      font-size: 12.5px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 48px rgba(0,0,0,0.55);
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
    }

    .modal-body {
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal-footer {
      padding: 15px 22px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .form-hint {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Setup Steps Guide */
    .step-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .step-num {
      display: inline-flex;
      width: 24px;
      height: 24px;
      border-radius: 99px;
      background: var(--accent-primary);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      align-items: center;
      justify-content: center;
      margin-right: 8px;
    }
    .copy-block {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: 8px;
      color: #93c5fd;
    }
    [data-theme="light"] .copy-block { color: #1e40af; }

    /* Auth Lock Screen Overlay */
    .auth-gate {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg-base);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-gate.active { display: flex; }

    .auth-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      padding: 36px 30px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-card);

    .google-btn {

      border-radius: 10px;
      background: #ffffff;
      color: #1f2937;
      font-size: 15px;
      font-weight: 700;
      border: 1px solid #d1d5db;

      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .google-btn:hover { background: #f9fafb; transform: translateY(-1px); }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      background: #1e293b;
      color: #f8fafc;
      border-left: 4px solid var(--accent-primary);
      padding: 12px 18px;
      border-radius: 10px;

      box-shadow: 0 10px 25px rgba(0,0,0,0.45);

    .feedback-history-list {

      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

</head>

      // 廚房夠鐘清脆叮聲（Web Audio API 免外部音檔）
      function playKitchenBell() {
        if (!state.prefs.sound) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const playTone = (freq, delay, dur) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
            gain.gain.setValueAtTime(0.18, ctx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + delay);
            osc.stop(ctx.currentTime + delay + dur);
          };
          playTone(880, 0, 0.45);
          playTone(1318.5, 0.16, 0.65);
        } catch (e) {}
      }

      function showToast(msg) {
        const container = document.getElementById('toastContainer');
        if (!container) return;
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = msg;
        container.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.25s ease';
          setTimeout(() => el.remove(), 260);
        }, 3400);
      }

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatDuration(mins) {
        const m = Math.max(0, Math.round(mins));
        if (m < 60) return m + ' 分鐘';
        const h = Math.floor(m / 60);
        const rem = m % 60;
        return rem > 0 ? `${h} 小時 ${rem} 分` : `${h} 小時`;
      }

      function formatClockDiff(ms) {
        const totalSec = Math.floor(Math.abs(ms) / 1000);
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        const pad = n => String(n).padStart(2, '0');
        return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
      }

      function formatDateTime(ts) {
        if (!ts) return '-';
        const d = new Date(ts);
        const pad = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      // 儲存資料（同時寫入 LocalStorage 並同步至 Google Cloud Firestore）
      async function persistState() {
        localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify(state.db));
        if (state.cloudConnected && state.firestore && state.currentUser && state.fbModules) {
          try {
            const { doc, setDoc } = state.fbModules;
            const ref = doc(state.firestore, 'users', state.currentUser.uid, 'ai_kitchen', 'production_state');
            const writeId = nowTs() + '_' + Math.random().toString(36).slice(2, 8);
            state.lastClientWriteId = writeId;
            await setDoc(ref, {
              tools: state.db.tools,
              projects: state.db.projects,
              logs: state.db.logs.slice(-1500),
              updatedAt: nowTs(),
              updatedBy: state.currentUser.email || '',
              clientWriteId: writeId
            });
          } catch (err) {
            console.error('Firestore sync error:', err);
            showToast('⚠️ 雲端同步失敗：請檢查網絡或 Firestore 安全規則');
          }
        }
      }

          projectId: project ? project.id : null,
          projectName: project ? project.name : '-',
          durationMinutes: Math.round(durationMinutes || 0),
          detail: detail || ''
        });

      // 動態載入官方 Google Firebase SDK 並處理登入及即時同步
      async function initFirebaseIfConfigured() {
        updateSyncBadge();
        const cfg = state.cloudCfg && state.cloudCfg.firebaseConfig;
        if (!cfg || !cfg.apiKey || !cfg.projectId) {
          document.getElementById('authGate').classList.remove('active');
          return;
        }

        // 若喺本機雙擊 file:// 打開，提醒需要放上 GitHub Pages 才可執行 Google OAuth
        if (window.location.protocol === 'file:') {
          document.getElementById('authGate').classList.remove('active');
          updateSyncBadge();
          return;
        }

        try {
          if (!state.fbModules) {
            const [appMod, authMod, fsMod] = await Promise.all([
              import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),
              import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js'),
              import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')
            ]);
            state.fbModules = { ...appMod, ...authMod, ...fsMod };
          }

          const { initializeApp, getApps, getAuth, GoogleAuthProvider, onAuthStateChanged, getFirestore, doc, onSnapshot, getDoc, setDoc } = state.fbModules;

          if (!getApps().length) {
            state.firebaseApp = initializeApp(cfg);
          } else {
            state.firebaseApp = getApps()[0];
          }
          state.auth = getAuth(state.firebaseApp);
          state.firestore = getFirestore(state.firebaseApp);
          state.googleProvider = new GoogleAuthProvider();

          onAuthStateChanged(state.auth, async (user) => {
            const authGate = document.getElementById('authGate');
            const errBox = document.getElementById('authErrorMsg');
            if (!user) {
              state.currentUser = null;
              state.cloudConnected = false;
              if (state.unsubSnapshot) { state.unsubSnapshot(); state.unsubSnapshot = null; }
              if (!state.bypassAuthLock) {
                authGate.classList.add('active');
              }
              updateSyncBadge();
              renderAll();
              return;
            }

            // 檢查私人專用白名單 Email
            const ownerEmail = (state.cloudCfg.ownerEmail || '').trim().toLowerCase();
            if (ownerEmail && (user.email || '').toLowerCase() !== ownerEmail) {
              errBox.style.display = 'block';
              errBox.textContent = `🚫 存取被拒：目前登入嘅帳號 (${user.email}) 唔係系統設定嘅專用擁有者 (${ownerEmail})。`;
              await state.fbModules.signOut(state.auth);
              authGate.classList.add('active');
              return;
            }

            errBox.style.display = 'none';
            authGate.classList.remove('active');
            state.currentUser = user;
            state.cloudConnected = true;
            updateSyncBadge();

            // 連接並訂閱雲端 Firestore 資料
            const stateDocRef = doc(state.firestore, 'users', user.uid, 'ai_kitchen', 'production_state');
            try {
              const snap = await getDoc(stateDocRef);
              if (!snap.exists()) {
                // 首次登入雲端：自動將現有設定與工具同步上雲端
                await setDoc(stateDocRef, {
                  tools: state.db.tools,
                  projects: state.db.projects,
                  logs: state.db.logs,
                  updatedAt: nowTs(),
                  updatedBy: user.email || ''
                });
                showToast('☁️ 首次登入成功！已自動初始化你嘅專屬雲端 Database');
              }
            } catch (readErr) {
              console.error(readErr);
              showToast('⚠️ 已登入 Google，但未能讀取 Firestore：請確認已在 Firebase 建立 Firestore 及設定規則');
            }

            if (state.unsubSnapshot) state.unsubSnapshot();
            state.unsubSnapshot = onSnapshot(stateDocRef, (docSnap) => {
              if (docSnap.exists()) {
                const cloudData = docSnap.data();
                if (cloudData && cloudData.clientWriteId && cloudData.clientWriteId === state.lastClientWriteId) {
                  return;
                }
                if (cloudData && Array.isArray(cloudData.tools)) {
                  state.db = {
                    tools: cloudData.tools || [],
                    projects: cloudData.projects || [],
                    logs: cloudData.logs || []
                  };
                  localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify(state.db));
                  renderAll();
                }
              }
            });
          });
        } catch (e) {
          console.error('Firebase init failed:', e);
          showToast('⚠️ 載入雲端模組失敗，暫以本地模式運行');
        }
      }

      // 計算各爐頭即時狀態
      function getActiveTools() {
        return [...state.db.tools].filter(t => !t.archived).sort((a, b) => (a.order || 0) - (b.order || 0));
      }

      function getToolActiveProject(toolId) {
        return state.db.projects.find(p => p.toolId === toolId && (p.status === 'running' || p.status === 'review' || p.status === 'paused'));
      }

      function renderHeaderStats() {
        const activeTools = getActiveTools();
        let running = 0, qa = 0, idle = 0;
        const now = nowTs();

        activeTools.forEach(t => {
          const p = getToolActiveProject(t.id);
          if (p) {
            if (p.status === 'review') qa++;
            else if (p.status === 'running') {
              const elapsedMin = (now - (p.currentRunStartedAt || p.startedAt)) / 60000;
              if (elapsedMin >= (p.estimatedMinutes || 30)) qa++;
              else running++;
            }
          } else if (!(t.cooldownUntil && t.cooldownUntil > now)) {
            idle++;
          }
        });

        const queued = state.db.projects.filter(p => p.status === 'queued').length;

        const statsEl = document.getElementById('headerStats');
        if (statsEl) {
          statsEl.innerHTML = `
            <span class="stat-pill run">🔥 烹調中: ${running}</span>
            <span class="stat-pill qa">👨‍🍳 待試味/Deploy: ${qa}</span>
            <span class="stat-pill idle">🟢 閒置可開火: ${idle}</span>
            <span class="stat-pill">🧺 備料排隊: ${queued}</span>
          `;

        if (navStoves) navStoves.textContent = activeTools.length;

        if (navProjs) navProjs.textContent = state.db.projects.length;

                  <span>${proj.status === 'review' ? '👨‍🍳 AI 已跑完本輪，請進行下方三步驗收' : '⏸️ 目前暫停計時中'}</span>
                  <span style="color:var(--text-secondary);">累計耗時：${formatDuration(proj.accumulatedMinutes || 0)}</span>
                </div>
              `}

              <div class="progress-inline-box">
                <div class="field-mini-label">
                  <span>💬 進度去到邊（一句說話隨時改，按 Enter 即存）</span>
                </div>
                <div class="inline-progress-row">
                  <input type="text" class="inline-input" id="prog_in_${proj.id}" value="${escapeHtml(proj.progressNote || '')}" placeholder="用一句說話寫低依家去到邊..." onkeydown="if(event.key==='Enter'){window.app.quickSaveProgress('${proj.id}');}" />
                  <button class="btn btn-secondary btn-sm" onclick="window.app.quickSaveProgress('${proj.id}')">儲存</button>
                </div>
              </div>

              ${dirsHtml}

              <div class="qa-box">
                <div class="qa-title">
                  <span>✅ 出菜前必做：修整 · 驗證 · Deploy</span>
                  <span style="font-weight:500;font-size:11px;">${[qa.refined, qa.verified, qa.deployed].filter(Boolean).length}/3 完成</span>
                </div>
                <div class="qa-checks">
                  <label class="qa-check-item">
                    <input type="checkbox" ${qa.refined ? 'checked' : ''} onchange="window.app.toggleQaCheck('${proj.id}', 'refined', this.checked)" />
                    <span>1. 修整細節</span>
                  </label>
                  <label class="qa-check-item">
                    <input type="checkbox" ${qa.verified ? 'checked' : ''} onchange="window.app.toggleQaCheck('${proj.id}', 'verified', this.checked)" />
                    <span>2. 本地驗證</span>
                  </label>
                  <label class="qa-check-item">
                    <input type="checkbox" ${qa.deployed ? 'checked' : ''} onchange="window.app.toggleQaCheck('${proj.id}', 'deployed', this.checked)" />
                    <span>3. Deploy 確認 Work</span>
                  </label>
                </div>
                ${fbLogsHtml}
              </div>
            `;

            footerHtml = `
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                ${proj.status === 'running' ? `
                  <button class="btn btn-qa btn-sm" onclick="window.app.moveToReview('${proj.id}')">👨‍🍳 煮好去驗收</button>
                ` : ''}
                <button class="btn btn-idle btn-sm" onclick="window.app.completeProject('${proj.id}')">✅ Work！完成上菜</button>
                <button class="btn btn-primary btn-sm" onclick="window.app.openFeedbackModal('${proj.id}')">🔄 唔Work · 畀Feedback</button>
              </div>
              <div style="display:flex;gap:5px;">
                <button class="icon-btn btn-sm" onclick="window.app.openEditProjectModal('${proj.id}')" title="修改項目名稱或路徑">✏️ 改資料</button>
              </div>
            `;
          } else {
            // 閒置或額度冷卻狀態
            const idleMins = tool.lastActiveEndedAt ? Math.max(0, (now - tool.lastActiveEndedAt) / 60000) : 0;
            const quickQueueOptions = queuedProjects.length > 0
              ? `<div style="margin-top:8px;width:100%;max-width:260px;">
                  <select class="form-select" style="font-size:12px;padding:6px 8px;" onchange="if(this.value){window.app.assignQueuedToStove(this.value, '${tool.id}');}">
                    <option value="">📥 從備料區揀 Project 直接落鍋...</option>
                    ${queuedProjects.map(qp => `<option value="${qp.id}">${escapeHtml(qp.name)}</option>`).join('')}
                  </select>
                </div>`
              : '';

            bodyHtml = `
              <div class="idle-empty-box" style="${isCooling ? 'border-color:rgba(56,189,248,0.35);background:rgba(56,189,248,0.05);' : ''}">
                <div class="idle-wok-icon">${isCooling ? '❄️' : '🍳'}</div>
                <div style="font-weight:700;font-size:14.5px;">
                  ${isCooling ? '算力額度冷卻等待重置中' : '隻鑊空緊！有閒置算力可用'}
                </div>
                <div class="idle-time-note">
                  ${isCooling
                    ? `預計冷卻至 ${formatDateTime(tool.cooldownUntil)}`
                    : `已閒置 <strong data-idle-timer="${tool.id}" data-idle-since="${tool.lastActiveEndedAt || now}">${formatDuration(idleMins)}</strong> · 仲有 <strong>${100 - quotaPct}%</strong> 算力未用盡`
                  }
                </div>
                <button class="btn btn-idle" style="margin-top:6px;" onclick="window.app.openNewProjectModal('${tool.id}')">🔥 立即安排新 Project 落鍋</button>
                ${quickQueueOptions}
              </div>
            `;

            footerHtml = `
              <span style="font-size:12px;color:var(--text-muted);">${escapeHtml(tool.quotaResetLabel || '記得善用配額')}</span>
              <div style="display:flex;gap:6px;">
                ${isCooling
                  ? `<button class="icon-btn btn-sm" onclick="window.app.clearCooldown('${tool.id}')">🔥 解除冷卻</button>`
                  : `<button class="icon-btn btn-sm" onclick="window.app.setCooldown('${tool.id}')" title="爆咗 Token 等緊重置時可標記">❄️ 標記爆額冷卻</button>`
                }
                <button class="icon-btn btn-sm" onclick="window.app.openEditToolModal('${tool.id}')">⚙️</button>
              </div>
            `;
          }

          return `
            <div class="stove-card ${cardStateClass}">
              <div class="stove-top">
                <div class="tool-identity">
                  <div class="tool-icon">${escapeHtml(tool.icon || '🤖')}</div>
                  <div>
                    <div class="tool-name">${escapeHtml(tool.name)}</div>
                    <div class="tool-workflow">${escapeHtml(tool.workflow || '')}</div>
                  </div>
                </div>
                ${chipHtml}
              </div>

              <div class="quota-strip" title="點擊調整本月/本輪已用算力百分比">
                <span style="color:var(--text-secondary);">已用配額: <strong style="color:var(--text-main);">${quotaPct}%</strong></span>
                <div class="quota-bar-wrap" onclick="window.app.promptUpdateQuota('${tool.id}')">
                  <div class="quota-bar-fill" style="width:${quotaPct}%;background:${quotaColor};"></div>
                </div>
                <button class="copy-mini-btn" onclick="window.app.promptUpdateQuota('${tool.id}')">更新%</button>
              </div>

              <div class="stove-body">${bodyHtml}</div>
              <div class="stove-footer">${footerHtml}</div>
            </div>
          `;
        }).join('');

        // 備料待煮區
        const prepHtml = queuedProjects.length === 0
          ? `<div style="padding:18px;text-align:center;color:var(--text-muted);font-size:13.5px;">目前備料區無排隊項目。當所有鑊都炒緊餸但你突然諗到新 Idea，可以先放落備料區排隊！</div>`
          : `<div class="prep-grid">
              ${queuedProjects.map(qp => {
                const prefTool = state.db.tools.find(t => t.id === qp.preferredToolId);
                return `
                  <div class="prep-card">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                      <strong style="font-size:14.5px;">${escapeHtml(qp.name)}</strong>
                      <span class="cook-badge">預計 ${qp.estimatedMinutes || 30}m</span>
                    </div>
                    ${qp.progressNote ? `<div style="font-size:12.5px;color:var(--text-secondary);">💬 ${escapeHtml(qp.progressNote)}</div>` : ''}
                    ${(qp.directories && qp.directories.length) ? `<div class="mono" style="font-size:11.5px;color:#93c5fd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">📁 ${escapeHtml(qp.directories[0])}${qp.directories.length > 1 ? ` (+${qp.directories.length-1})` : ''}</div>` : ''}
                    <div style="margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
                      <span style="font-size:11.5px;color:var(--text-muted);">${prefTool ? '首選：' + escapeHtml(prefTool.name) : '未指定工具'}</span>
                      <div style="display:flex;gap:6px;">
                        <button class="btn btn-idle btn-sm" onclick="window.app.openEditProjectModal('${qp.id}')">🔥 揀鑊落鍋 / 編輯</button>
                        <button class="btn btn-danger btn-sm" onclick="window.app.deleteProject('${qp.id}')">刪除</button>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>`;

        container.innerHTML = `
          ${hasSamples ? `
            <div class="sample-banner">
              <span>✨ <strong>新手導覽：</strong>畫面預載咗 3 個【範例】項目，等你可以即刻睇到「運行緊」、「待驗證 Deploy」同「備料排隊」嘅效果！試玩完可以一鍵清空範例。</span>
              <button class="btn btn-secondary btn-sm" onclick="window.app.clearSampleProjects()">🧹 清空範例 Project 正式開始</button>
            </div>
          ` : ''}

          <div class="chef-banner">
            <div class="chef-banner-text">${chefAdvice}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-primary" onclick="window.app.openNewProjectModal('')">+ 新增 Project / 落鍋開火</button>
              <button class="btn btn-secondary" onclick="window.app.openNewToolModal()">+ 加新 AI 工具</button>
            </div>
          </div>

          <div class="section-header">
            <div class="section-title">🔥 我嘅 AI 生產線爐頭（共 ${activeTools.length} 個活躍訂閱）</div>
            <span style="font-size:12.5px;color:var(--text-secondary);">提示：做完記得剔齊「修整 · 驗證 · Deploy」，唔 Work 就㩒「畀 Feedback」回鍋！</span>
          </div>

          <div class="stoves-grid">${stovesHtml}</div>

          <div class="prep-section">
            <div class="section-header" style="margin-bottom:4px;">
              <div class="section-title">🧺 備料待煮區（預先排隊嘅新 Project 靈感）</div>
              <button class="btn btn-secondary btn-sm" onclick="window.app.openNewProjectModal('QUEUE')">+ 先擺個新 Project 入備料區</button>
            </div>
            <p style="font-size:12.5px;color:var(--text-secondary);">預先寫低想做嘅 Project 名同 File Directory，一有爐頭閒置就可以一秒落鍋，零空窗期！</p>
            ${prepHtml}
          </div>
        `;
      }

      // 分頁 2：所有專案紀錄與資料庫搜尋（獨立渲染表格列，避免搜尋輸入時中斷中文輸入法游標）
      function buildProjectsRowsHtml() {
        const kw = (state.projSearch || '').trim().toLowerCase();
        const filtered = [...state.db.projects]
          .sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0))
          .filter(p => {
            if (state.projFilterStatus !== 'all' && p.status !== state.projFilterStatus) return false;
            if (state.projFilterTool !== 'all' && p.toolId !== state.projFilterTool) return false;
            if (kw) {
              const hay = [p.name, p.progressNote, ...(p.directories || [])].join(' ').toLowerCase();
              if (!hay.includes(kw)) return false;
            }
            return true;
          });

        const statusBadgeMap = {
          running: '<span class="status-chip chip-running">🔥 運行中</span>',
          review: '<span class="status-chip chip-review">👨‍🍳 待驗證/Deploy</span>',
          queued: '<span class="status-chip chip-cool">🧺 備料待煮</span>',
          paused: '<span class="status-chip chip-cool">⏸️ 暫停</span>',
          completed: '<span class="status-chip chip-idle">✅ 已完成上菜</span>'
        };

        const rowsHtml = filtered.length === 0
          ? `<tr><td colspan="6" style="text-align:center;padding:28px;color:var(--text-muted);">搵唔到符合條件嘅 Project 紀錄</td></tr>`
          : filtered.map(p => {
              const tool = state.db.tools.find(t => t.id === (p.toolId || p.preferredToolId));
              return `
                <tr>
                  <td>
                    <div style="font-weight:700;">${escapeHtml(p.name)}</div>
                    <div style="font-size:11.5px;color:var(--text-muted);margin-top:3px;">開工：${formatDateTime(p.startedAt)}${p.completedAt ? `<br>完成：${formatDateTime(p.completedAt)}` : ''}</div>
                  </td>
                  <td>${tool ? `${escapeHtml(tool.icon)} ${escapeHtml(tool.name)}` : '<span style="color:var(--text-muted);">未分配</span>'}</td>
                  <td>
                    ${statusBadgeMap[p.status] || p.status}
                    <div style="font-size:11.5px;color:var(--text-secondary);margin-top:5px;">
                      回鍋 Feedback：<strong>${p.feedbackCount || 0}</strong> 次 · 耗時 ${formatDuration(p.accumulatedMinutes || 0)}
                    </div>
                  </td>
                  <td>
                    ${(p.directories && p.directories.length)
                      ? p.directories.map(d => `
                        <div style="display:flex;align-items:center;gap:5px;margin-bottom:4px;">
                          <code style="font-size:11.5px;color:#93c5fd;">${escapeHtml(d)}</code>
                          <button class="copy-mini-btn" data-copy="${escapeHtml(d)}" onclick="window.app.copyFromAttr(this)">複製</button>
                        </div>
                      `).join('')
                      : '<span style="color:var(--text-muted);font-size:12px;">-</span>'
                    }
                  </td>
                  <td style="max-width:260px;">${escapeHtml(p.progressNote || '-')}</td>
                  <td>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                      <button class="btn btn-secondary btn-sm" onclick="window.app.openEditProjectModal('${p.id}')">編輯</button>
                      ${p.status === 'completed' ? `<button class="btn btn-primary btn-sm" onclick="window.app.reopenProject('${p.id}')">重開回鍋</button>` : ''}
                      <button class="btn btn-danger btn-sm" onclick="window.app.deleteProject('${p.id}')">刪除</button>
                    </div>
                  </td>
                </tr>
              `;
            }).join('');

        return { count: filtered.length, rowsHtml };
      }

      function refreshProjectsTableOnly() {
        const tbody = document.getElementById('projectsTableBody');
        const countEl = document.getElementById('projectsCountSpan');
        if (!tbody) {
          renderProjectsTab(document.getElementById('mainView'));
          return;
        }
        const { count, rowsHtml } = buildProjectsRowsHtml();
        tbody.innerHTML = rowsHtml;
        if (countEl) countEl.textContent = count;
      }

      function renderProjectsTab(container) {
        const { count, rowsHtml } = buildProjectsRowsHtml();
        container.innerHTML = `
          <div class="panel-card">
            <div class="section-header">
              <div class="section-title">📋 專案資料庫總覽（共 <span id="projectsCountSpan">${count}</span> 筆紀錄）</div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn btn-secondary btn-sm" onclick="window.app.exportCSV()">📊 匯出 Excel CSV</button>
                <button class="btn btn-primary btn-sm" onclick="window.app.openNewProjectModal('')">+ 新增 Project</button>
              </div>
            </div>

            <div class="filter-bar">
              <input type="text" class="form-input" style="max-width:280px;" placeholder="🔍 搜尋 Project 名、進度或資料夾路徑..." value="${escapeHtml(state.projSearch)}" oninput="window.app.setProjSearch(this.value)" />
              <select class="form-select" style="max-width:180px;" onchange="window.app.setProjFilterStatus(this.value)">
                <option value="all" ${state.projFilterStatus === 'all' ? 'selected' : ''}>所有狀態</option>
                <option value="running" ${state.projFilterStatus === 'running' ? 'selected' : ''}>🔥 烹調運行中</option>
                <option value="review" ${state.projFilterStatus === 'review' ? 'selected' : ''}>👨‍🍳 待驗證 Deploy</option>
                <option value="queued" ${state.projFilterStatus === 'queued' ? 'selected' : ''}>🧺 備料待煮</option>
                <option value="completed" ${state.projFilterStatus === 'completed' ? 'selected' : ''}>✅ 已完成上菜</option>
              </select>
              <select class="form-select" style="max-width:210px;" onchange="window.app.setProjFilterTool(this.value)">
                <option value="all" ${state.projFilterTool === 'all' ? 'selected' : ''}>所有 AI 工具</option>
                ${state.db.tools.map(t => `<option value="${t.id}" ${state.projFilterTool === t.id ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('')}
              </select>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Project 名稱 / 時間</th>
                    <th>使用 AI 工具</th>
                    <th>狀態 & 回鍋次數</th>
                    <th>相關電腦 File Directories</th>
                    <th>進度去到邊（一句說話）</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="projectsTableBody">
                  ${rowsHtml}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      // 分頁 3：算力效益分析與定期檢討
      function renderAnalyticsTab(container) {
        const days = Number(state.prefs.analyticsDays) || 30;
        const cutoff = days === 9999 ? 0 : nowTs() - days * 86400 * 1000;

        const periodProjects = state.db.projects.filter(p => (p.startedAt || 0) >= cutoff);
        const completedProjs = periodProjects.filter(p => p.status === 'completed');
        const totalActiveMins = periodProjects.reduce((acc, p) => acc + (Number(p.accumulatedMinutes) || 0), 0);
        const firstPassCount = completedProjs.filter(p => (p.feedbackCount || 0) === 0).length;
        const firstPassRate = completedProjs.length > 0 ? Math.round((firstPassCount / completedProjs.length) * 100) : 100;

        const activeTools = getActiveTools();
        const totalMonthlyHKD = activeTools.reduce((acc, t) => acc + (Number(t.monthlyCostHKD) || 0), 0);

        // 各工具詳細統計（包含已封存工具的歷史數據）
        const toolMetrics = state.db.tools.map(t => {
          const tProjs = periodProjects.filter(p => p.toolId === t.id);
          const tDone = tProjs.filter(p => p.status === 'completed');
          const tMins = tProjs.reduce((s, p) => s + (Number(p.accumulatedMinutes) || 0), 0);
          const tFeedbacks = tProjs.reduce((s, p) => s + (Number(p.feedbackCount) || 0), 0);
          const avgFeedback = tProjs.length > 0 ? (tFeedbacks / tProjs.length).toFixed(1) : '0.0';
          const costPerDone = tDone.length > 0 && t.monthlyCostHKD > 0 ? 'HK$' + Math.round(t.monthlyCostHKD / tDone.length) : '-';

          let verdict = '<span class="status-chip chip-idle">✅ 正常運作</span>';
          if (!t.archived && tProjs.length === 0 && (t.quotaUsedPct || 0) < 25) {
            verdict = '<span class="status-chip chip-overdue">⚠️ 嚴重閒置 · 快安排任務！</span>';
          } else if (tDone.length >= 3 && Number(avgFeedback) <= 1) {
            verdict = '<span class="status-chip chip-idle">🏆 高產穩定主力</span>';
          } else if (Number(avgFeedback) >= 2.5) {
            verdict = '<span class="status-chip chip-running">🔧 回鍋率高 · 建議執靚 Prompt</span>';
          }

          return {
            tool: t,
            totalCount: tProjs.length,
            doneCount: tDone.length,
            mins: tMins,
            feedbacks: tFeedbacks,
            avgFeedback,
            costPerDone,
            verdict
          };
        });

        const maxMins = Math.max(60, ...toolMetrics.map(m => m.mins));

        container.innerHTML = `
          <div class="section-header">
            <div class="section-title">📊 AI 生產線效益檢討與數據分析</div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
              <select class="form-select" style="width:auto;" onchange="window.app.setAnalyticsDays(this.value)">
                <option value="7" ${days === 7 ? 'selected' : ''}>檢討範圍：過去 7 日</option>
                <option value="30" ${days === 30 ? 'selected' : ''}>檢討範圍：過去 30 日</option>
                <option value="9999" ${days === 9999 ? 'selected' : ''}>檢討範圍：全部歷史紀錄</option>
              </select>
              <button class="btn btn-secondary btn-sm" onclick="window.app.exportCSV()">📥 匯出 CSV 報表</button>
              <button class="btn btn-secondary btn-sm" onclick="window.app.exportJSONBackup()">💾 匯出完整 JSON 備份</button>
              <label class="btn btn-secondary btn-sm" style="cursor:pointer;">
                📂 匯入 JSON 備份
                <input type="file" accept=".json" style="display:none;" onchange="window.app.importJSONBackup(event)" />
              </label>
            </div>
          </div>

          <div class="kpi-grid">
            <div class="kpi-card">
              <div class="kpi-label">✅ 期內完成上菜 Project</div>
              <div class="kpi-value" style="color:#34d399;">${completedProjs.length} <span style="font-size:14px;font-weight:500;">個（共開鍋 ${periodProjects.length} 個）</span></div>
              <div class="kpi-sub">完成並通過驗證 Deploy 嘅項目總數</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">🔥 累計 AI 實際烹調工時</div>
              <div class="kpi-value" style="color:#fb923c;">${(totalActiveMins / 60).toFixed(1)} <span style="font-size:14px;font-weight:500;">小時</span></div>
              <div class="kpi-sub">各 AI 爐頭幫你自動跑任務嘅總時間</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">🎯 一次通過率（免回鍋重炒）</div>
              <div class="kpi-value" style="color:#c084fc;">${firstPassRate}%</div>
              <div class="kpi-sub">越少「唔Work回鍋」代表工具同 Prompt 越夾</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">💳 活躍訂閱每月總預算</div>
              <div class="kpi-value" style="color:#38bdf8;">HK$${totalMonthlyHKD}</div>
              <div class="kpi-sub">共 ${activeTools.length} 個活躍 AI 爐頭（可在工具頁調整月費）</div>
            </div>

      // 解析用家貼上嘅任何格式 firebaseConfig（支援純 JSON 或成段 JS 程式碼）
      function parseFirebaseConfigInput(rawText) {
        const txt = (rawText || '').trim();
        if (!txt) return null;
        try {
          const j = JSON.parse(txt);
          if (j && j.apiKey && j.projectId) return j;
        } catch (e) {}

        const keys = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'];
        const extracted = {};
        keys.forEach(k => {
          const reg = new RegExp(k + '\\s*:\\s*["\']([^"\']+)["\']');
          const m = txt.match(reg);
          if (m && m[1]) extracted[k] = m[1].trim();
        });
        if (extracted.apiKey && extracted.projectId) {
          if (!extracted.authDomain) extracted.authDomain = extracted.projectId + '.firebaseapp.com';
          return extracted;
        }
        return null;
      }

      // 每秒更新倒數計時器與閒置時間（不重繪整個 DOM，確保輸入框打字流暢不中斷）
      setInterval(() => {
        const now = nowTs();
        state.db.projects.forEach(p => {
          if (p.status !== 'running') return;
          const elapsedMs = now - (p.currentRunStartedAt || p.startedAt);
          const estMs = (p.estimatedMinutes || 30) * 60000;
          const isOver = elapsedMs >= estMs;

          if (isOver && !state.notifiedOverdueIds.has(p.id + '_' + p.currentRunStartedAt)) {
            state.notifiedOverdueIds.add(p.id + '_' + p.currentRunStartedAt);
            playKitchenBell();
            const tool = state.db.tools.find(t => t.id === p.toolId);
            showToast(`🔔 【夠鐘試味】${tool ? tool.name : 'AI 爐頭'} 嘅「${p.name}」預計時間已到，快去驗證及 Deploy！`);
            renderHeaderStats();
          }

          const liveEl = document.querySelector(`[data-live-timer="${p.id}"]`);
          if (liveEl) {
            liveEl.textContent = isOver
              ? '🔔 已超時 ' + formatClockDiff(elapsedMs - estMs) + '（快去試味！）'
              : '⏱️ 剩餘約 ' + formatClockDiff(estMs - elapsedMs);
            liveEl.style.color = isOver ? '#facc15' : 'var(--text-main)';
          }
          const elapEl = document.querySelector(`[data-elapsed-timer="${p.id}"]`);
          if (elapEl) elapEl.textContent = formatClockDiff(elapsedMs);

          const barEl = document.querySelector(`[data-timer-bar="${p.id}"]`);
          if (barEl) {
            const pct = Math.min(100, Math.round((elapsedMs / estMs) * 100));
            barEl.style.width = pct + '%';
            if (isOver) barEl.classList.add('overdue');
          }
        });

        document.querySelectorAll('[data-idle-timer]').forEach(el => {
          const since = Number(el.getAttribute('data-idle-since')) || now;
          el.textContent = formatDuration((now - since) / 60000);
        });
      }, 1000);
